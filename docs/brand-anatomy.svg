<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-label="Big Mouth Burger — Brand Identity &amp; 7-Layer Exploded Anatomy">
  <defs>
    <linearGradient id="bgAnat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0604"/>
      <stop offset="50%" stop-color="#140b06"/>
      <stop offset="100%" stop-color="#080503"/>
    </linearGradient>
    <radialGradient id="glowAnat" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080503" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderAnat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#292524" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="gridAnat" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#f5ebdc" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="clipAnat">
      <rect width="1600" height="480" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipAnat)">
    <rect width="1600" height="480" fill="url(#bgAnat)"/>
    <rect width="1600" height="480" fill="url(#glowAnat)"/>
    <rect width="1600" height="480" fill="url(#gridAnat)"/>

    <!-- Top Telemetry Header -->
    <line x1="0" y1="58" x2="1600" y2="58" stroke="#292524" stroke-width="1.5"/>
    <g transform="translate(48, 35)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="2.2">
      <circle cx="6" cy="-4" r="4" fill="#f59e0b"/>
      <text x="20" y="0" fill="#f5ebdc" font-weight="600">BRAND DESIGN SYSTEM &amp; CULINARY ANATOMY // DOSSIER 01</text>
      <text x="640" y="0" fill="#a8a29e">ART DIRECTION : FLAME-GRILLED EDITORIAL COMMERCE</text>
      <text x="1310" y="0" fill="#fbbf24">SPEC // JKR-INSPIRED</text>
    </g>

    <!-- Center Vertical Divider -->
    <line x1="760" y1="58" x2="760" y2="480" stroke="#292524" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- ============================================================ -->
    <!-- LEFT COLUMN : FLAME-GRILLED COLOR & TYPOGRAPHIC IDENTITY     -->
    <!-- ============================================================ -->
    <g transform="translate(48, 98)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#f59e0b">01 // CHROMATIC PALETTE (FLAME &amp; BRIoche)</text>
      <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f5ebdc">Editorial Color &amp; Visual Voice</text>
      <text x="395" y="32" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#fbbf24">· 烈焰炙烤视觉识别体系</text>

      <!-- 5 Color Swatch Cards -->
      <g transform="translate(0, 62)" font-family="'JetBrains Mono', monospace">
        <!-- Swatch 1: Flame Orange -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="124" height="128" rx="12" fill="#1c1410" stroke="#44403c"/>
          <rect x="8" y="8" width="108" height="66" rx="8" fill="#FF5500"/>
          <text x="12" y="94" font-size="11" font-weight="700" fill="#f5ebdc">FLAME SEAR</text>
          <text x="12" y="112" font-size="10" fill="#a8a29e">#FF5500</text>
        </g>

        <!-- Swatch 2: Molten Cheddar -->
        <g transform="translate(136, 0)">
          <rect x="0" y="0" width="124" height="128" rx="12" fill="#1c1410" stroke="#44403c"/>
          <rect x="8" y="8" width="108" height="66" rx="8" fill="#F59E0B"/>
          <text x="12" y="94" font-size="11" font-weight="700" fill="#f5ebdc">AGED GOLD</text>
          <text x="12" y="112" font-size="10" fill="#a8a29e">#F59E0B</text>
        </g>

        <!-- Swatch 3: Toasted Brioche Cream -->
        <g transform="translate(272, 0)">
          <rect x="0" y="0" width="124" height="128" rx="12" fill="#1c1410" stroke="#44403c"/>
          <rect x="8" y="8" width="108" height="66" rx="8" fill="#F5EBDC"/>
          <text x="12" y="94" font-size="11" font-weight="700" fill="#f5ebdc">BRIOCHE CREAM</text>
          <text x="12" y="112" font-size="10" fill="#a8a29e">#F5EBDC</text>
        </g>

        <!-- Swatch 4: Crisp Oak Leaf -->
        <g transform="translate(408, 0)">
          <rect x="0" y="0" width="124" height="128" rx="12" fill="#1c1410" stroke="#44403c"/>
          <rect x="8" y="8" width="108" height="66" rx="8" fill="#2E7D32"/>
          <text x="12" y="94" font-size="11" font-weight="700" fill="#f5ebdc">OAK LEAF</text>
          <text x="12" y="112" font-size="10" fill="#a8a29e">#2E7D32</text>
        </g>

        <!-- Swatch 5: Charred Espresso -->
        <g transform="translate(544, 0)">
          <rect x="0" y="0" width="124" height="128" rx="12" fill="#1c1410" stroke="#44403c"/>
          <rect x="8" y="8" width="108" height="66" rx="8" fill="#0D0805" stroke="#292524"/>
          <text x="12" y="94" font-size="11" font-weight="700" fill="#f5ebdc">CHARRED DARK</text>
          <text x="12" y="112" font-size="10" fill="#a8a29e">#0D0805</text>
        </g>
      </g>

      <!-- Typography & Poster Direction Box -->
      <g transform="translate(0, 214)">
        <rect x="0" y="0" width="668" height="132" rx="14" fill="#120b07" stroke="#292524"/>
        <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="2" fill="#fbbf24">TYPOGRAPHIC HIERARCHY &amp; CAMPAIGN POSTER PRINCIPLES</text>
        <text x="22" y="64" font-family="Impact, 'Arial Black', Inter, sans-serif" font-size="30" letter-spacing="1" fill="#f5ebdc">FLAME-SEARED DISPLAY GROTESQUE</text>
        <text x="22" y="92" font-family="Inter, -apple-system, sans-serif" font-size="13.5" fill="#a8a29e">High-impact condensed poster headlines paired with warm toasted-brioche cream (#F5EBDC),</text>
        <text x="22" y="112" font-family="Inter, -apple-system, sans-serif" font-size="13.5" fill="#a8a29e">macro studio rim lighting, and deterministic 3D spatial choreography.</text>
      </g>
    </g>

    <!-- ============================================================ -->
    <!-- RIGHT COLUMN : 7-LAYER EXPLODED BURGER ANATOMY SCHEMATIC     -->
    <!-- ============================================================ -->
    <g transform="translate(804, 98)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#fbbf24">02 // DETERMINISTIC 3D &amp; CULINARY ANATOMY</text>
      <text x="0" y="34" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f5ebdc">7-Layer Exploded Architecture</text>
      <text x="392" y="32" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#fbbf24">· 七层风味与三维解构图谱</text>

      <!-- Left Isometric Exploded Stack Diagram -->
      <g transform="translate(18, 68)">
        <!-- Center Axis Line -->
        <line x1="110" y1="8" x2="110" y2="275" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 5"/>

        <!-- L1: Top Brioche Crown -->
        <path d="M 38 42 C 38 6, 182 6, 182 42 Z" fill="#d97706" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1.8"/>
        <ellipse cx="110" cy="42" rx="72" ry="14" fill="#b45309" fill-opacity="0.4" stroke="#f5ebdc" stroke-width="1.2"/>
        <circle cx="88" cy="24" r="2" fill="#f5ebdc"/><circle cx="112" cy="19" r="2" fill="#f5ebdc"/><circle cx="136" cy="26" r="2" fill="#f5ebdc"/>

        <!-- L2: Crispy Onion Rings -->
        <ellipse cx="110" cy="78" rx="64" ry="15" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 3"/>

        <!-- L3: Heirloom Tomato & Jalapeno -->
        <ellipse cx="92" cy="112" rx="38" ry="10" fill="#ef4444" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5"/>
        <ellipse cx="132" cy="115" rx="36" ry="10" fill="#ef4444" fill-opacity="0.35" stroke="#f87171" stroke-width="1.5"/>

        <!-- L4: Crisp Oak-Leaf Lettuce -->
        <ellipse cx="110" cy="148" rx="76" ry="16" fill="#15803d" fill-opacity="0.35" stroke="#4ade80" stroke-width="1.6"/>

        <!-- L5: Quad Molten Cheddar -->
        <polygon points="34,182 114,168 186,182 106,198" fill="#f59e0b" fill-opacity="0.45" stroke="#fde047" stroke-width="1.6"/>

        <!-- L6: 200°C Flame-Seared Double Wagyu Patty -->
        <ellipse cx="110" cy="220" rx="74" ry="18" fill="#78350f" fill-opacity="0.6" stroke="#f97316" stroke-width="2"/>

        <!-- L7: Toasted Brioche Heel Bun -->
        <ellipse cx="110" cy="258" rx="70" ry="15" fill="#b45309" fill-opacity="0.45" stroke="#fbbf24" stroke-width="1.6"/>
      </g>

      <!-- Right Callout Spec List aligned with the 7 Layers -->
      <g transform="translate(260, 68)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5">
        <g transform="translate(0, 18)">
          <text x="0" y="0" fill="#fbbf24" font-weight="700">L01 // Y:+0.85</text>
          <text x="128" y="0" fill="#f5ebdc" font-family="Inter, sans-serif" font-weight="600">Artisan Sesame Brioche Crown (手工黑金芝麻布里欧修顶胚)</text>
        </g>
        <g transform="translate(0, 56)">
          <text x="0" y="0" fill="#fb923c" font-weight="700">L02 // Y:+0.35</text>
          <text x="128" y="0" fill="#f5ebdc" font-family="Inter, sans-serif" font-weight="600">Crispy Beer-Battered Onion Rings (酥炸焦糖洋葱圈)</text>
        </g>
        <g transform="translate(0, 94)">
          <text x="0" y="0" fill="#f87171" font-weight="700">L03 // Y:+0.25</text>
          <text x="128" y="0" fill="#f5ebdc" font-family="Inter, sans-serif" font-weight="600">Smoked Bacon &amp; Pickled Relish (果木烟熏培根与酸黄瓜)</text>
        </g>
        <g transform="translate(0, 132)">
          <text x="0" y="0" fill="#4ade80" font-weight="700">L04 // Y:+0.10</text>
          <text x="128" y="0" fill="#f5ebdc" font-family="Inter, sans-serif" font-weight="600">Hydroponic Crisp Oak-Leaf Canopy (鲜脆水培橡叶生菜)</text>
        </g>
        <g transform="translate(0, 170)">
          <text x="0" y="0" fill="#fde047" font-weight="700">L05 // Y:-0.05</text>
          <text x="128" y="0" fill="#f5ebdc" font-family="Inter, sans-serif" font-weight="600">Quadruple Molten Aged Cheddar (四重熟成熔岩切达芝士)</text>
        </g>
        <g transform="translate(0, 208)">
          <text x="0" y="0" fill="#f97316" font-weight="700">L06 // Y:-0.30</text>
          <text x="128" y="0" fill="#f5ebdc" font-family="Inter, sans-serif" font-weight="600">200°C Open-Flame Double Angus (200°C 直火菱格炙烤双层安格斯)</text>
        </g>
        <g transform="translate(0, 246)">
          <text x="0" y="0" fill="#fbbf24" font-weight="700">L07 // Y:-0.65</text>
          <text x="128" y="0" fill="#f5ebdc" font-family="Inter, sans-serif" font-weight="600">Butter-Toasted Brioche Heel Base (黄油慢烘布里欧修底托)</text>
        </g>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="478" rx="19" fill="none" stroke="url(#borderAnat)" stroke-width="2"/>
</svg>
