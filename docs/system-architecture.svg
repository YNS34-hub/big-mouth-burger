<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="290" viewBox="0 0 1600 290" role="img" aria-label="Big Mouth Burger — Technical Stack &amp; Interactive Pipeline">
  <defs>
    <linearGradient id="bgSys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090604"/>
      <stop offset="100%" stop-color="#120b07"/>
    </linearGradient>
    <linearGradient id="borderSys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#292524" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="clipSys">
      <rect width="1600" height="290" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipSys)">
    <rect width="1600" height="290" fill="url(#bgSys)"/>
    <line x1="0" y1="54" x2="1600" y2="54" stroke="#292524" stroke-width="1.5"/>

    <g transform="translate(48, 34)" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="2">
      <text x="0" y="0" fill="#fbbf24" font-weight="600">ENGINEERING ARCHITECTURE // FRONTEND, 3D &amp; DETERMINISTIC QA</text>
      <text x="1280" y="0" fill="#34d399">● CI PIPELINE VERIFIED</text>
    </g>

    <!-- 4 Architectural Pillars -->
    <g transform="translate(48, 82)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="356" height="172" rx="12" fill="#140c08" stroke="#292524"/>
      <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fbbf24">01 // CORE FRAMEWORK</text>
      <text x="20" y="58" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#f5ebdc">Next.js 16 + React 19</text>
      <text x="20" y="86" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">App Router architecture with TypeScript 5</text>
      <text x="20" y="108" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">strict mode &amp; Tailwind CSS v4 tokens.</text>
      <text x="20" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#f59e0b">NEXT 16.2 · REACT 19.2 · TS 5</text>

      <!-- Card 2 -->
      <rect x="382" y="0" width="356" height="172" rx="12" fill="#140c08" stroke="#292524"/>
      <text x="402" y="30" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fbbf24">02 // REAL-TIME 3D ENGINE</text>
      <text x="402" y="58" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#f5ebdc">Three.js &amp; R3F Scene</text>
      <text x="402" y="86" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">Deterministic seeded PRNG ingredient</text>
      <text x="402" y="108" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">placement, PBR materials &amp; orbital float.</text>
      <text x="402" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#f59e0b">THREE r184 · R3F 9 · DREI 10</text>

      <!-- Card 3 -->
      <rect x="764" y="0" width="356" height="172" rx="12" fill="#140c08" stroke="#292524"/>
      <text x="784" y="30" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fbbf24">03 // KINETIC CHOREOGRAPHY</text>
      <text x="784" y="58" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#f5ebdc">Framer Motion 12</text>
      <text x="784" y="86" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">Scroll-linked parallax hero, spring-physics</text>
      <text x="784" y="108" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">campaign cards &amp; interactive layer modal.</text>
      <text x="784" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#f59e0b">SCROLL PARALLAX · SPRING UI</text>

      <!-- Card 4 -->
      <rect x="1146" y="0" width="358" height="172" rx="12" fill="#140c08" stroke="#292524"/>
      <text x="1166" y="30" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fbbf24">04 // QUALITY GATE &amp; CI</text>
      <text x="1166" y="58" font-family="Inter, sans-serif" font-size="19" font-weight="800" fill="#f5ebdc">Automated Verification</text>
      <text x="1166" y="86" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">GitHub Actions workflow verifying</text>
      <text x="1166" y="108" font-family="Inter, sans-serif" font-size="13" fill="#a8a29e">ESLint 9 rules &amp; zero-error production build.</text>
      <text x="1166" y="148" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#34d399">NPM CI → LINT → BUILD</text>
    </g>
  </g>

  <rect x="1" y="1" width="1598" height="288" rx="17" fill="none" stroke="url(#borderSys)" stroke-width="2"/>
</svg>
